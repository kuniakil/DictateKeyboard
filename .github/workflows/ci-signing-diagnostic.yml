name: Signing Diagnostic

# 臨時診斷用：確認 Gradle/AGP 實際使用哪一把 debug keystore。
# 驗證完就會刪除這個 workflow。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android-related environment
        run: |
          echo "HOME=$HOME"
          echo "user.home=$(user.home 2>/dev/null || echo n/a)"
          echo "--- env | grep -i android ---"
          env | grep -i android || echo "(無 ANDROID_* 變數)"
          echo "--- ~/.android ---"
          ls -la "$HOME/.android" 2>&1 || true

      - name: Install Android NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          NDK_VER=$(grep "^ndk " gradle/tools.versions.toml | sed -E "s/.*\"(.*)\".*/\1/")
          CMAKE_VER=$(grep "^cmake " gradle/tools.versions.toml | sed -E "s/.*\"(.*)\".*/\1/")
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "ndk;${NDK_VER}" "cmake;${CMAKE_VER}"

      - name: Restore fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf "%s" "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "--- 還原後的檔案 ---"
          ls -la "$HOME/.android/debug.keystore"
          echo "--- 金鑰內容（別名 + 憑證指紋）---"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -E "Alias name:|Entry type:|SHA256:|SHA-256:|Valid from"

      - name: What does AGP pick by default?
        run: |
          ./gradlew :app:signingReport --no-daemon 2>&1 | grep -E "Variant: debug|Config:|Store:|Alias:|SHA-256:|SHA256:" | head -20

      - name: What does AGP pick with injected signing properties?
        run: |
          ./gradlew :app:signingReport --no-daemon \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android 2>&1 \
            | grep -E "Variant: debug|Config:|Store:|Alias:|SHA-256:|SHA256:" | head -20
