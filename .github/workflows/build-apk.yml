name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          NDK_VER=$(grep "^ndk " gradle/tools.versions.toml | sed -E "s/.*\"(.*)\".*/\1/")
          CMAKE_VER=$(grep "^cmake " gradle/tools.versions.toml | sed -E "s/.*\"(.*)\".*/\1/")
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "ndk;${NDK_VER}" "cmake;${CMAKE_VER}"

      - name: Restore fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          printf "%s" "$KEYSTORE_B64" | base64 -d > "$KS"
          keytool -list -keystore "$KS" -storepass android >/dev/null
          # AGP 在這台 runner 上實際採用的是 $XDG_CONFIG_HOME/.android/debug.keystore
          # （runner 映像有設 XDG_CONFIG_HOME=/home/runner/.config），不是 $HOME/.android。
          # 同一把金鑰複製一份過去，兩條路徑都對（見工作表 1.5 節的實測）。
          if [ -n "${XDG_CONFIG_HOME:-}" ]; then
            mkdir -p "$XDG_CONFIG_HOME/.android"
            cp "$KS" "$XDG_CONFIG_HOME/.android/debug.keystore"
          fi
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "--- 還原回來的金鑰 ---"
          keytool -list -v -keystore "$KS" -storepass android \
            | grep -E "Alias name:|SHA256:" | head -4
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-（未設定）}"

      - name: Diagnose signing key
        run: |
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-（未設定）}"
          echo "--- AGP 實際會用哪一把？ ---"
          ./gradlew :app:signingReport --no-daemon 2>&1 \
            | grep -E "Variant: debug|Config:|Store:|Alias:|SHA-256:|SHA256:" | head -12

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libraries
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Build Bergamot native library
        run: bash tools/bergamot/build-android.sh

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$DEBUG_KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep "^projectVersionName=" gradle.properties | cut -d= -f2 | tr -d "[:space:]")
          BRANCH="${GITHUB_REF_NAME:-main}"
          TAG="v${VERSION}-apk"
          # On a side branch, tag the release with the branch so a branch build
          # never clobbers the main branch's release asset.
          if [ "$BRANCH" != "main" ]; then
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^A-Za-z0-9._-]/-/g')
            TAG="v${VERSION}-apk-${SAFE_BRANCH}"
          fi
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "DictateKeyboard v${VERSION} (APK)" \
              --notes "Auto-built Debug APK with fixed signing keystore." \
              --target "$BRANCH"
          fi
