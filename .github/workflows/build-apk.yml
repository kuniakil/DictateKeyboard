name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          NDK_VER=$(grep "^ndk " gradle/tools.versions.toml | sed -E "s/.*\"(.*)\".*/\1/")
          CMAKE_VER=$(grep "^cmake " gradle/tools.versions.toml | sed -E "s/.*\"(.*)\".*/\1/")
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "ndk;${NDK_VER}" "cmake;${CMAKE_VER}"

      - name: Restore fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          printf "%s" "$KEYSTORE_B64" | base64 -d > "$KS"
          keytool -list -keystore "$KS" -storepass android >/dev/null
          # AGP 在這台 runner 上實際採用的是 $XDG_CONFIG_HOME/.android/debug.keystore
          # （runner 映像有設 XDG_CONFIG_HOME=/home/runner/.config），不是 $HOME/.android。
          # 同一把金鑰複製一份過去，兩條路徑都對（見工作表 1.5 節的實測）。
          if [ -n "${XDG_CONFIG_HOME:-}" ]; then
            mkdir -p "$XDG_CONFIG_HOME/.android"
            cp "$KS" "$XDG_CONFIG_HOME/.android/debug.keystore"
          fi
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "--- 還原回來的金鑰 ---"
          keytool -list -v -keystore "$KS" -storepass android \
            | grep -E "Alias name:|SHA256:" | head -4
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-（未設定）}"

      - name: Diagnose signing key
        run: |
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-（未設定）}"
          echo "--- AGP 實際會用哪一把？ ---"
          ./gradlew :app:signingReport --no-daemon 2>&1 \
            | grep -E "Variant: debug|Config:|Store:|Alias:|SHA-256:|SHA256:" | head -12

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libraries
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Build Bergamot native library
        run: bash tools/bergamot/build-android.sh

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$DEBUG_KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep "^projectVersionName=" gradle.properties | cut -d= -f2 | tr -d "[:space:]")
          BRANCH="${GITHUB_REF_NAME:-main}"
          TAG="v${VERSION}-apk"
          # On a side branch, tag the release with the branch so a branch build
          # never clobbers the main branch's release asset.
          if [ "$BRANCH" != "main" ]; then
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^A-Za-z0-9._-]/-/g')
            TAG="v${VERSION}-apk-${SAFE_BRANCH}"
          fi
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          # Apache-2.0 §4(b)/(d): a binary distribution must state what the fork
          # changed and ship the upstream attribution notices next to it. Both files
          # are attached to every release, so the obligations hold for every build
          # and not only for the ones somebody remembers to document.
          cp NOTICE NOTICE.txt
          NOTES_FILE="release-notes.md"
          cat > "$NOTES_FILE" <<'NOTES'
          Unofficial personal fork debug build (for personal use and zh-TW localization testing). Not an official release of DevEmperor/DictateKeyboard — please support the original author by purchasing the official app on Google Play: https://play.google.com/store/apps/details?id=net.devemperor.dictate

          ### What this fork changed (Apache-2.0 §4(b))

          The complete file-by-file list is attached as `MODIFICATIONS.md`. In short:

          | # | Area | Change |
          |---|---|---|
          | 1 | App UI | New `values-zh-rTW` locale — Traditional Chinese (Taiwan): 2547 strings + 11 plurals |
          | 2 | Watch UI | New `values-zh-rTW` locale for the watch — 69 strings |
          | 3 | Language picker | One line added: the `zh-TW` tag, so the app can be switched to 中文 (台灣) |
          | 4 | Typing layout | New Cangjie (倉頡) radical character layout |
          | 5 | zh-TW defaults | The `zh-TW-*` typing subtypes use `$` instead of `¥`; Cangjie as default layout |
          | 6 | Build & release | This workflow — a signed debug APK published on GitHub Releases (upstream publishes no APK there) |
          | 7 | Toolchain | The localisation scripts, translation data and Taiwan-usage glossary that produced and check the zh-TW strings |

          ### Attribution (Apache-2.0 §4(d))

          The upstream `NOTICE` file is attached to this release unchanged as `NOTICE.txt`; the Apache-2.0 text also ships inside the app (*Settings → About → Open source licenses*).

          Apache-2.0 grants no trademark rights, so this build is marked unofficial, uses the application id `net.devemperor.dictate.debug`, and installs **next to** the official app instead of replacing it. The on-device models are downloaded at runtime from the upstream project's releases — no model weights are redistributed here.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
            gh release upload "$TAG" NOTICE.txt --clobber
            gh release upload "$TAG" docs/fork/MODIFICATIONS.md --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$APK_FILE" NOTICE.txt docs/fork/MODIFICATIONS.md \
              --title "DictateKeyboard v${VERSION} (APK)" \
              --notes-file "$NOTES_FILE" \
              --target "$BRANCH"
          fi
